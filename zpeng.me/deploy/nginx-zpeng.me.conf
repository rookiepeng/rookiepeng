# Static zpeng.me, served to cloudflared on localhost only. Cloudflare terminates TLS, so this
# block speaks plain HTTP and listens on a separate port from the WordPress vhost; switching the
# tunnel between the two ports is the cutover (and the rollback).
# Install: /etc/nginx/sites-available/zpeng-static.conf, symlinked into sites-enabled (see deploy/README.md).
server {
    listen 127.0.0.1:8088;
    server_name zpeng.me;

    root /srv/zpeng-static/public;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Redirects (e.g. /publications -> /publications/) must not leak this port or plain http
    absolute_redirect off;

    # Log the visitor's address, not cloudflared's
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/xml application/rss+xml image/svg+xml;

    error_page 404 /404.html;

    # Old WordPress feed and admin URLs
    location = /feed/          { return 301 /feed.xml; }
    location = /comments/feed/ { return 301 /feed.xml; }
    location ~ ^/(wp-login\.php|xmlrpc\.php|wp-admin) { return 404; }

    # Fingerprinted build output (CSS, JS, optimized images) never changes
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # Pages revalidate so a deploy shows up immediately
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        try_files $uri $uri/ =404;
    }
}
